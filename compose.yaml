services:
  db:
    image: timescale/timescaledb:2.31.0-pg16
    container_name: deriv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deriv_db}
      POSTGRES_USER: ${POSTGRES_USER:-deriv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deriv_pass}
    volumes:
      - postgres_timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deriv_user} -d ${POSTGRES_DB:-deriv_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deriv_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deriv_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-Deriv Trading Backend}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      PORT: 8000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-deriv_db}
      POSTGRES_USER: ${POSTGRES_USER:-deriv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deriv_pass}
      DERIV_WS_URL: ${DERIV_WS_URL:-wss://api.derivws.com/trading/v1/options/ws/public}
      DERIV_SYMBOLS: ${DERIV_SYMBOLS:-1HZ100V}
      DERIV_RECONNECT_DELAY_SECONDS: ${DERIV_RECONNECT_DELAY_SECONDS:-2}
      DERIV_BATCH_SIZE: ${DERIV_BATCH_SIZE:-500}
      DERIV_FLUSH_INTERVAL_SECONDS: ${DERIV_FLUSH_INTERVAL_SECONDS:-0.5}
      DERIV_OAUTH_CLIENT_ID: ${DERIV_OAUTH_CLIENT_ID:-}
      DERIV_OAUTH_REDIRECT_URI: ${DERIV_OAUTH_REDIRECT_URI:-http://localhost:8000/auth/deriv/callback}
      DERIV_OAUTH_SCOPE: ${DERIV_OAUTH_SCOPE:-trade}
      DERIV_OAUTH_AUTH_URL: ${DERIV_OAUTH_AUTH_URL:-https://auth.deriv.com/oauth2/auth}
      DERIV_OAUTH_TOKEN_URL: ${DERIV_OAUTH_TOKEN_URL:-https://auth.deriv.com/oauth2/token}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      EMAIL_VERIFICATION_TOKEN_MINUTES: ${EMAIL_VERIFICATION_TOKEN_MINUTES:-1440}
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      db:
        condition: service_healthy
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    networks:
      - deriv_network

networks:
  deriv_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  postgres_timescale_data:
    driver: local

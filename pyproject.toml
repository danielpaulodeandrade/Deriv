[project]
name = "deriv-backend"
version = "0.1.0"
description = "Backend para robos de trading e ingestao na Deriv"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "asyncpg==0.32.0",
    "alembic==1.17.2",
    "sqlalchemy==2.0.48",
    "websockets>=14,<16",
    "pwdlib[argon2]>=0.2,<1",
    "PyJWT>=2.10,<3",
    "email-validator>=2.2,<3",
    "cryptography>=44,<48",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
